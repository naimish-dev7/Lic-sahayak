<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Sahayak // Voice Portal</title>
    
    <!-- PWA Manifest Embedded -->

    <meta name="theme-color" content="#0284c7">
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --surface: #0f172a;
            --card: #1e293b;
            --accent-gold: #fbbf24;
            --lic-blue: #0284c7;
            --whatsapp: #22c55e;
            --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 16px; }

        .portal-card {
            background: linear-gradient(180deg, #0f172a, #060913);
            border: 1px solid rgba(2, 132, 199, 0.3);
            border-radius: 28px; padding: 32px 24px;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        }

        .avatar-ring {
            width: 88px; height: 88px; border-radius: 50%;
            background: linear-gradient(135deg, var(--lic-blue), var(--accent-gold));
            display: flex; align-items: center; justify-content: center;
            font-size: 38px; margin-bottom: 16px;
            box-shadow: 0 0 30px rgba(2, 132, 199, 0.4);
        }
        .avatar-ring.pulsing { animation: pulse 1.5s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); box-shadow: 0 0 40px var(--accent-gold); } }

        .title { font-size: 20px; font-weight: 800; color: #fff; }
        .subtitle { font-size: 12px; color: var(--accent-gold); margin-top: 4px; font-weight: 600; text-transform: uppercase; }

        .waveform {
            width: 100%; height: 48px; background: rgba(0,0,0,0.4);
            border-radius: 12px; margin: 24px 0; display: flex; align-items: center;
            justify-content: center; gap: 4px; padding: 0 16px;
        }
        .bar { width: 4px; height: 10px; background: var(--lic-blue); border-radius: 2px; transition: height 0.1s; }

        .screen {
            width: 100%; min-height: 80px; background: rgba(0,0,0,0.5);
            border: 1px solid var(--border); border-radius: 12px;
            padding: 12px 14px; font-family: 'JetBrains Mono', monospace;
            font-size: 12px; color: #38bdf8; text-align: left; margin-bottom: 24px;
            line-height: 1.5;
        }

        .btn-call {
            width: 72px; height: 72px; border-radius: 50%; border: none; cursor: pointer;
            font-size: 28px; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease; box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .btn-call.start { background: var(--whatsapp); color: #000; }
        .btn-call.end { background: var(--danger); color: #fff; }
        .btn-call:hover { transform: scale(1.1); }

        .admin-link {
            text-align: center; font-size: 11.5px; color: var(--text-muted);
            cursor: pointer; margin-top: 8px; text-decoration: underline;
        }
        .admin-link:hover { color: var(--accent-gold); }

        #admin-panel {
            display: none; width: 100%; max-width: 900px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 20px; padding: 20px; flex-direction: column; gap: 16px;
        }
        .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .text-input {
            background: rgba(0,0,0,0.4); border: 1px solid var(--border); color: #fff;
            padding: 10px 14px; border-radius: 10px; font-size: 13px; outline: none; width: 100%;
        }
        .text-input:focus { border-color: var(--accent-gold); }
        .btn {
            background: var(--accent-gold); color: #000; border: none; padding: 8px 14px;
            border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer;
        }
        .table-wrap { max-height: 400px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
        th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
        th { background: #0b1220; color: var(--accent-gold); position: sticky; top: 0; }
    </style>
</head>
<body>

<div class="container" id="client-view">
    <div class="portal-card">
        <div class="avatar-ring" id="avatar">🛡️</div>
        <div class="title">LIC Sahayak</div>
        <div class="subtitle">Official AI Voice Support Line</div>

        <div class="waveform" id="waveform">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>

        <div class="screen" id="transcript">
            Tap the green button below to speak directly with the LIC assistant about policies, plans, or dues.
        </div>

        <button class="btn-call start" id="call-btn" onclick="toggleCall()">📞</button>
    </div>

    <div class="admin-link" onclick="promptAgentLogin()">🔐 Agent Login (Agent Only)</div>
</div>

<div class="container" id="admin-panel" style="display:none;">
    <div class="admin-header">
        <h3 style="color: var(--accent-gold);">🛡️ Agent Command Center</h3>
        <button class="btn" style="background:var(--danger); color:#fff;" onclick="lockAdmin()">Lock & Exit</button>
    </div>

    <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <input type="text" id="in-name" class="text-input" style="flex:1; min-width:180px;" placeholder="Client Name" />
        <input type="text" id="in-phone" class="text-input" style="flex:1; min-width:140px;" placeholder="Phone (9876543210)" />
        <input type="text" id="in-plan" class="text-input" style="flex:1; min-width:140px;" placeholder="Plan (e.g. Jeevan Labh)" />
        <input type="text" id="in-amt" class="text-input" style="width:110px;" placeholder="Amount" />
        <input type="text" id="in-due" class="text-input" style="width:130px;" placeholder="Due Date" />
        <button class="btn" style="background:var(--whatsapp);" onclick="saveClient()">Save Client</button>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr><th>Name</th><th>Phone</th><th>Plan</th><th>Due Info</th><th>Action</th></tr>
            </thead>
            <tbody id="crm-table"></tbody>
        </table>
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register(URL.createObjectURL(new Blob([`self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));`], { type: 'text/javascript' }))).catch(() => {});
    }

    const DEFAULT_DATA = {
        "9876543210": { name: "Ramesh Kumar", phone: "9876543210", plan: "Jeevan Labh", policy_no: "128475920", amount: "₹14,250", due: "28 Oct 2026" },
        "9123456789": { name: "Sunita Verma", phone: "9123456789", plan: "Jeevan Umang", policy_no: "349102847", amount: "₹26,000", due: "15 Nov 2026" }
    };
    function getClients() { return JSON.parse(localStorage.getItem('LIC_SAFE_DB')) || DEFAULT_DATA; }
    function saveClients(data) { localStorage.setItem('LIC_SAFE_DB', JSON.stringify(data)); renderTable(); }

    function promptAgentLogin() {
        const pin = prompt("Enter 4-Digit Agent PIN:");
        if (pin === "1956") {
            document.getElementById('client-view').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'flex';
            renderTable();
        } else if (pin !== null) {
            alert("Incorrect PIN.");
        }
    }
    function lockAdmin() {
        document.getElementById('admin-panel').style.display = 'none';
        document.getElementById('client-view').style.display = 'flex';
    }

    let apiKey = localStorage.getItem('LIC_SAFE_KEY') || '';
    if(!apiKey) {
        apiKey = prompt("Enter Gemini 3.8 Flash API Key:") || "";
        if(apiKey) localStorage.setItem('LIC_SAFE_KEY', apiKey);
    }

    let isCalling = false, recog, waveInt;

    function animateWave(active) {
        const bars = document.querySelectorAll('.bar');
        const av = document.getElementById('avatar');
        if (active) {
            av.classList.add('pulsing');
            waveInt = setInterval(() => { bars.forEach(b => b.style.height = `${Math.floor(Math.random()*28)+8}px`); }, 100);
        } else {
            av.classList.remove('pulsing'); clearInterval(waveInt);
            bars.forEach(b => b.style.height = '10px');
        }
    }

    function speakAudio(text, cb) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        const voices = window.speechSynthesis.getVoices();
        const inVoice = voices.find(v => v.lang.includes('hi') || v.lang.includes('IN')) || voices[0];
        if (inVoice) u.voice = inVoice;
        u.onstart = () => animateWave(true);
        u.onend = () => { animateWave(false); if(cb) cb(); };
        u.onerror = () => { animateWave(false); if(cb) cb(); };
        window.speechSynthesis.speak(u);
    }

    function toggleCall() {
        const btn = document.getElementById('call-btn');
        if (!isCalling) {
            isCalling = true; btn.className = 'btn-call end'; btn.innerText = '✕';
            document.getElementById('transcript').innerText = "Connecting to LIC Sahayak...";
            speakAudio("Namaste! LIC Sahayak me aapka swagat hai. Kahiye, main aapki kya sahayata karu?", () => { if(isCalling) listen(); });
        } else {
            isCalling = false; btn.className = 'btn-call start'; btn.innerText = '📞';
            window.speechSynthesis.cancel(); animateWave(false); if(recog) recog.abort();
            document.getElementById('transcript').innerText = "Call ended. Tap green button to start a new call.";
        }
    }

    function listen() {
        if(!isCalling) return;
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) { alert("Microphone supported only in Chrome/Brave."); return; }
        recog = new SR(); recog.lang = 'hi-IN';
        recog.onstart = () => document.getElementById('transcript').innerText = "Listening to you...";
        recog.onresult = async (e) => {
            const txt = e.results[0][0].text;
            document.getElementById('transcript').innerText = `You: "${txt}"\nThinking...`;
            await processVoiceAI(txt);
        };
        recog.onerror = () => { if(isCalling) setTimeout(listen, 1000); };
        recog.start();
    }

    async function processVoiceAI(input) {
        if (!apiKey) { speakAudio("API Key missing."); return; }
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: `You are LIC Sahayak. Client DB: ${JSON.stringify(getClients())}. Caller: "${input}". Reply in 1-2 short sentences in Hindi/Hinglish suitable for a voice call.` }] }], generationConfig: { temperature: 0.6, maxOutputTokens: 120 } })
            });
            const data = await res.json();
            const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Ji, kripya dobara boliye.";
            document.getElementById('transcript').innerText = `Assistant: "${reply}"`;
            speakAudio(reply, () => { if (isCalling) listen(); });
        } catch (e) {
            speakAudio("Network drop.");
        }
    }

    function renderTable() {
        const clients = getClients();
        const tbody = document.getElementById('crm-table');
        tbody.innerHTML = '';
        Object.keys(clients).forEach(p => {
            const c = clients[p];
            tbody.innerHTML += `<tr><td><b>${c.name}</b></td><td><code>${c.phone}</code></td><td>${c.plan}</td><td><b>${c.amount}</b><br><small>${c.due}</small></td><td><button class="btn" style="background:var(--danger); color:#fff; padding:3px 6px; font-size:10px;" onclick="delClient('${p}')">Delete</button></td></tr>`;
        });
    }

    function saveClient() {
        const c = { name: document.getElementById('in-name').value, phone: document.getElementById('in-phone').value, plan: document.getElementById('in-plan').value, amount: document.getElementById('in-amt').value, due: document.getElementById('in-due').value };
        if(!c.name || !c.phone) return alert("Name & Phone required");
        const db = getClients(); db[c.phone] = c; saveClients(db);
        document.getElementById('in-name').value = ''; document.getElementById('in-phone').value = '';
        alert("Client saved!");
    }

    function delClient(phone) {
        if(confirm("Delete record?")) { const db = getClients(); delete db[phone]; saveClients(db); }
    }
</script>
</body>
</html>
